<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>역사톡 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --side:#25313B; --side-hi:#35444F; --side-text:#E8EDF0; --side-mute:#9DACB6;
  --main:#F1F3EF; --panel:#FFFFFF; --ink:#1F2A31; --mute:#5C6A73; --line:#D8DDD7;
  --accent:#2F7A72; --accent-ink:#FFFFFF; --gold:#B7862B; --danger:#A5453A; --danger-bg:rgba(165,69,58,.10);
  --shadow:0 10px 34px rgba(20,30,40,.22);
  --sans:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --serif:'Noto Serif KR','Nanum Myeongjo','Batang',serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --side:#141B21; --side-hi:#26333D; --side-text:#E8EDF0; --side-mute:#8797A2;
    --main:#1B2329; --panel:#232D35; --ink:#E6ECEF; --mute:#97A5AE; --line:#33404A;
    --accent:#5DB3A8; --accent-ink:#0E1D1B; --gold:#D8A94A; --danger:#E08A7E; --danger-bg:rgba(224,138,126,.14);
    --shadow:0 10px 34px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --side:#141B21; --side-hi:#26333D; --side-text:#E8EDF0; --side-mute:#8797A2;
  --main:#1B2329; --panel:#232D35; --ink:#E6ECEF; --mute:#97A5AE; --line:#33404A;
  --accent:#5DB3A8; --accent-ink:#0E1D1B; --gold:#D8A94A; --danger:#E08A7E; --danger-bg:rgba(224,138,126,.14);
  --shadow:0 10px 34px rgba(0,0,0,.5);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--main);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.serif{font-family:var(--serif)}
.muted{color:var(--mute)}

/* 로그인 */
#login{height:100%;display:grid;place-items:center;padding:20px;background:var(--side);
  background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 2px,transparent 2px 18px);overflow:auto}
.card{width:min(410px,100%);background:var(--panel);border-radius:14px;padding:30px 28px;box-shadow:var(--shadow)}
.brand{font-family:var(--serif);font-size:32px;font-weight:700;margin:0 0 4px}
.tagline{margin:0 0 22px;color:var(--mute)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--main);padding:4px;border-radius:10px;margin-bottom:18px}
.seg button{border:0;background:transparent;padding:9px;border-radius:7px;font-weight:600;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.field input,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.field textarea{resize:vertical;min-height:70px}
.btn{border:0;border-radius:9px;padding:10px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.full{width:100%;padding:12px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:6px 12px;font-size:13px}
.hint{font-size:13px;color:var(--mute);margin:14px 0 0}

/* 앱 레이아웃 */
#app{display:flex;height:100%}
.side{width:284px;flex:none;background:var(--side);color:var(--side-text);display:flex;flex-direction:column;z-index:30}
.me{display:flex;align-items:center;gap:6px;padding:12px;border-bottom:1px solid rgba(255,255,255,.09)}
.me .who{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;background:none;border:0;color:inherit;padding:6px;border-radius:9px}
.me .who:hover,.iconbtn:hover{background:rgba(255,255,255,.08)}
.me .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .sub{font-size:12px;color:var(--side-mute)}
.iconbtn{width:34px;height:34px;display:grid;place-items:center;border:0;background:transparent;border-radius:8px;color:inherit;flex:none}
.side-scroll{flex:1;overflow:auto;padding:8px}
.sec{display:flex;justify-content:space-between;align-items:center;padding:14px 8px 6px;color:var(--side-mute);font-size:13px;font-weight:600}
.item{display:flex;width:100%;align-items:center;gap:10px;padding:7px 8px;border-radius:9px;background:none;border:0;color:var(--side-text);text-align:left}
.item:hover{background:rgba(255,255,255,.07)}
.item.active{background:var(--side-hi)}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t small{display:block;font-size:12px;color:var(--side-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.roomdot{width:36px;height:36px;border-radius:10px;background:var(--side-hi);display:grid;place-items:center;font-weight:700;flex:none}
.item.active .roomdot{background:rgba(255,255,255,.14)}
.lockhint{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;background:none;border:1px dashed rgba(255,255,255,.2);color:var(--side-mute);border-radius:9px;padding:8px 10px;margin-top:6px;font-size:13px}
.addroom{display:flex;align-items:center;gap:8px;width:100%;background:none;border:1px dashed rgba(255,255,255,.3);color:var(--side-text);border-radius:9px;padding:8px 10px;margin-top:6px;font-weight:600}
.addroom:hover{background:rgba(255,255,255,.07)}

.av{flex:none;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--serif);font-weight:700;background-size:cover;background-position:center;border:0;padding:0;overflow:hidden}
.tag{font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;margin-left:6px;vertical-align:1px}
.tag.ai{background:var(--gold);color:#1c1503}
.tag.teacher{background:var(--accent);color:var(--accent-ink)}

.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--main)}
.head{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:58px;border-bottom:1px solid var(--line);background:var(--panel);flex:none}
.head h1{font-size:17px;margin:0;font-weight:700}
.head .grow{flex:1;min-width:0}
.head .grow small{display:block;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menubtn{display:none;color:var(--ink)}
.members{display:flex}
.members .av{margin-left:-8px;border:2px solid var(--panel)}
.members .av:first-child{margin-left:0}
.notice{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;font-size:13px;color:var(--mute)}
.notice p{margin:0;flex:1}
.notice button{background:none;border:1px solid var(--line);border-radius:7px;padding:2px 10px;font-size:12px}
.feed{flex:1;overflow:auto;padding:14px 16px 6px}
.empty{color:var(--mute);text-align:center;margin-top:40px}
.msg{display:flex;gap:12px;padding:8px 0;max-width:760px}
.msg .body{min-width:0;flex:1}
.meta{display:flex;align-items:baseline;gap:2px;flex-wrap:wrap}
.meta .name{background:none;border:0;padding:0;font-weight:700;font-size:15px}
.meta .name:hover{text-decoration:underline}
.meta time{margin-left:8px;font-size:12px;color:var(--mute)}
.text{white-space:pre-wrap;overflow-wrap:anywhere}
.text.fig{font-family:var(--serif);font-size:15.5px;line-height:1.85;border-left:3px solid var(--gold);padding-left:12px;margin-top:3px}
.refs{margin:10px 0 0 15px;font-size:12.5px;color:var(--mute)}
.refs-title{font-weight:600;margin-bottom:2px}
.refs ul{margin:0;padding-left:16px}
.refs li{margin:1px 0}
.refs a{color:var(--accent);margin-right:8px}
.refs .source-note{font-size:11.5px;color:var(--mute);margin-top:5px}
.followup-label{font-size:11.5px;color:var(--mute);margin:12px 0 5px}
.chips button{max-width:100%;text-align:left}
.msg .text.fig{white-space:pre-wrap}
.verify{margin-top:5px;font-size:11.5px;color:var(--mute);opacity:.9}
.lock{display:flex;gap:8px;align-items:center;margin:8px 0 0 15px;padding:7px 10px;border-radius:8px;background:var(--danger-bg);color:var(--danger);font-size:13px;font-weight:600;width:fit-content;max-width:100%}
.dots{display:inline-flex;gap:4px;padding:8px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--mute);opacity:.5;animation:blink 1.1s infinite}
.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}
@keyframes blink{50%{opacity:1}}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:6px 16px 0}
.chips button{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:5px 13px;font-size:13px}
.chips button:hover{border-color:var(--accent);color:var(--accent)}
.composer{padding:10px 16px 16px;flex:none}
.box{display:flex;align-items:flex-end;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 7px 7px 14px}
.box:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.box textarea{flex:1;border:0;background:transparent;resize:none;max-height:120px;outline:none;padding:7px 0;line-height:1.5}
.send{width:38px;height:38px;border-radius:9px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}

/* 모달 */
.overlay{position:fixed;inset:0;background:rgba(10,15,20,.6);display:grid;place-items:center;padding:16px;z-index:60;overflow:auto}
.pcard{width:min(400px,100%);background:var(--panel);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.banner{height:118px;background-size:cover;background-position:center;position:relative}
.banner .x{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.35);color:#fff;border-radius:50%}
.pbody{padding:0 22px 22px}
.pav{margin-top:-44px;width:88px;height:88px;border-radius:50%;border:4px solid var(--panel);overflow:hidden;background:var(--panel)}
.pname{font-family:var(--serif);font-size:24px;font-weight:700;margin:8px 0 0}
.prole{color:var(--mute);font-size:14px;margin:0 0 14px}
.rows{margin:0;display:grid;gap:12px}
.rows dt{font-size:12.5px;font-weight:600;color:var(--mute);margin-bottom:1px}
.rows dd{margin:0}
.pactions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222c33;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:80;box-shadow:var(--shadow);max-width:90vw}
.scrim{display:none}
.toolsbar{display:flex;gap:6px;flex-wrap:wrap;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.toolsbar button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 9px;font-size:12px}
.toolsbar button:hover{border-color:var(--accent);color:var(--accent)}
.msgtools{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.msgtools button{font-size:11px;padding:2px 7px;border:1px solid var(--line);border-radius:7px;background:var(--panel)}
.msgtools button:hover{color:var(--accent);border-color:var(--accent)}
.room-code{font-size:12px;background:var(--main);border:1px dashed var(--line);border-radius:8px;padding:7px 10px;margin:8px 0}
.noticebar{border-left:3px solid var(--gold);padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);font-size:13px;display:flex;gap:8px;align-items:flex-start}
.noticebar span{flex:1;white-space:pre-wrap}
.attachimg{display:block;max-width:min(360px,100%);max-height:260px;object-fit:contain;border-radius:10px;margin-top:8px;border:1px solid var(--line)}
.shared-card{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px;background:var(--main)}
.smallnote{font-size:12px;color:var(--mute)}


@media (max-width:760px){
  .side{position:fixed;inset:0 auto 0 0;transform:translateX(-102%);transition:transform .2s;width:min(300px,86vw);padding-top:env(safe-area-inset-top,0px)}
  .side.open{transform:none}
  .scrim.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20}
  .menubtn{display:grid}
  .members{display:none}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}.dots i{animation:none}}
</style>
</head>
<body>

<!-- 로그인 -->
<section id="login">
  <form class="card" id="loginForm" autocomplete="off">
    <h1 class="brand">역사톡</h1>
    <p class="tagline">역사 속 인물에게 직접 묻고, 우리 반과 함께 배워요.</p>
    <div class="seg" role="group" aria-label="로그인 유형">
      <button type="button" id="tabStudent" aria-pressed="true">학생</button>
      <button type="button" id="tabTeacher" aria-pressed="false">교직원</button>
    </div>
    <label class="field"><span>이름</span><input id="loginName" placeholder="예: 김하늘"></label>
    <label class="field"><span>비밀번호</span><input id="loginPw" type="password" placeholder="프로토타입에서는 아무거나 괜찮아요"></label>
    <button class="btn full" type="submit" id="authSubmit">로그인</button>
    <button class="btn ghost full" type="button" id="authToggle" style="margin-top:8px">처음이신가요? 회원가입</button>
    <p class="hint" id="authHint">시연용 계정은 이 브라우저에만 저장됩니다. 실제 보안이 필요한 서비스에는 Firebase 인증 연결이 필요합니다.</p>
  </form>
</section>

<!-- 앱 -->
<div id="app" hidden>
  <aside class="side" id="side">
    <div class="me">
      <button class="who" id="meBtn" aria-label="내 프로필 열기"></button>
      <button class="iconbtn" id="logoutBtn" aria-label="로그아웃" title="로그아웃"></button>
    </div>
    <div class="side-scroll">
      <div class="sec">역사 인물</div>
      <div id="figList"></div>
      <div class="sec">우리 반 방</div>
      <div id="roomList"></div>
      <div id="roomAction"></div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <section class="main">
    <header class="head" id="head"></header>
    <div class="notice" id="notice">
      <p>역사 인물 대화는 준비된 시나리오를 바탕으로 작동합니다. 학급 채팅의 계정·방·승인 기능은 현재 브라우저 내 시연용이며, 실제 여러 기기 간 동기화와 안전한 인증에는 Firebase 연결이 필요합니다. 공유한 자료의 출처와 내용은 직접 확인해 주세요.</p>
      <button id="noticeClose">닫기</button>
    </div>
    <div class="toolsbar" id="toolsbar" hidden></div>
    <div class="noticebar" id="pinnedNotice" hidden><strong>📌 공지</strong><span id="pinnedText"></span><button class="btn ghost small" id="editNoticeBtn">관리</button></div>
    <div class="feed" id="feed"></div>
    <div class="chips" id="chips"></div>
    <div class="composer">
      <div class="box">
        <button class="iconbtn" id="photoBtn" aria-label="사진 첨부" title="사진 첨부">＋</button>
        <textarea id="input" rows="1" aria-label="메시지 입력"></textarea>
        <button class="send" id="sendBtn" aria-label="보내기"></button>
      </div>
    </div>
  </section>
</div>

<input id="imagePicker" type="file" accept="image/*" hidden>
<div class="overlay" id="modal" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
function h(tag,attrs){
  var e=document.createElement(tag);
  attrs=attrs||{};
  Object.keys(attrs).forEach(function(k){
    var v=attrs[k];
    if(v===false||v==null)return;
    if(k==="class")e.className=v;
    else if(k.indexOf("on")===0)e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?"":v);
  });
  for(var i=2;i<arguments.length;i++){
    var kids=[].concat(arguments[i]);
    kids.forEach(function(k){
      if(k==null||k===false)return;
      e.append(k.nodeType?k:document.createTextNode(k));
    });
  }
  return e;
}
var ICON={
  lock:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  send:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>',
  plus:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  menu:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
  close:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  out:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>'
};
function icon(name,cls){var s=h("span",{class:cls||""});s.innerHTML=ICON[name];s.style.display="inline-flex";return s}

/* ---------- 출처(예시) ---------- */
function mk(org,url){return function(t){return {t:t,org:org,url:url}}}
var E=mk("한국민족문화대백과사전","https://encykorea.aks.ac.kr");
var SIL=mk("조선왕조실록 (국사편찬위원회)","https://sillok.history.go.kr");
var KHS=mk("국가유산청","https://www.khs.go.kr");
var HG=mk("국립한글박물관","https://www.hangeul.go.kr");
var I815=mk("독립기념관","https://www.i815.or.kr");
var ITKC=mk("한국고전종합DB (한국고전번역원)","https://db.itkc.or.kr");
var MUS=mk("국립중앙박물관","https://www.museum.go.kr");

/* ---------- 역사 인물 데이터 ---------- */
var FIGS=[
{
  id:"yi",name:"이순신",color:"#2F4F6F",kind:"figure",
  role:"조선의 무신, 삼도수군통제사",
  born:"1545년 4월 28일 (음력 3월 8일)",died:"1598년 12월 16일 (음력 11월 19일)",
  likes:"활쏘기, 일기 쓰기",
  traits:"임진왜란 때 바다에서 나라를 지킨 장수. 준비를 철저히 하고 원칙을 지키는 지휘관으로 알려져 있어요.",
  refuse:"이 자리는 배움의 자리요. 그런 이야기에는 답하지 않겠소. 나라를 지킨 일이나 그 시절 이야기를 물어보시오.",

        !isMe&&isFig&&h("button",{class:"btn",onclick:function(){closeModal();go("f:"+id)}},"대화하기"),
        h("button",{class:"btn ghost",onclick:closeModal},"닫기")));
    if(isFig)body.append(h("p",{class:"hint",style:"margin-bottom:0"},"대화는 미리 작성된 시나리오를 바탕으로 재구성됩니다. 실제 발언과 창작된 말투를 구분하고, 참고 자료를 직접 확인해 주세요."));
  }
  var card=h("div",{class:"pcard",role:"dialog","aria-modal":"true","aria-label":p.name+" 프로필"},banner,body);
  var m=$("#modal");m.replaceChildren(card);m.hidden=false;
}

/* ---------- 방 만들기(교직원) ---------- */
function openNewRoom(){
  var nm=h("input",{placeholder:"예: 임진왜란 모둠 토론",maxlength:"24"});
  var card=h("div",{class:"pcard",role:"dialog","aria-modal":"true","aria-label":"방 만들기"},
    h("div",{class:"pbody",style:"padding-top:22px"},
      h("p",{class:"pname",style:"margin-top:0"},"방 만들기"),
      h("p",{class:"prole"},"만든 방에는 우리 반 학생들이 함께 들어와요."),
      h("label",{class:"field"},h("span",{},"방 이름"),nm),
      h("div",{class:"pactions"},
        h("button",{class:"btn",onclick:function(){
          var name=nm.value.trim();if(!name){toast("방 이름을 적어 주세요.");return}
          var id="r"+Date.now();
          var code=makeCode();
          rooms.push({id:id,name:name,code:code,owner:"me",members:["me"],pending:[],kicked:[]});
          chats["r:"+id]=[];closeModal();go("r:"+id);toast("방을 만들었어요. 방 코드: "+code);
        }},"만들기"),
        h("button",{class:"btn ghost",onclick:closeModal},"취소"))));
  var m=$("#modal");m.replaceChildren(card);m.hidden=false;nm.focus();
}

/* ---------- 이벤트 ---------- */
$("#modal").addEventListener("click",function(e){if(e.target===this)closeModal()});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!$("#modal").hidden)closeModal()});
$("#scrim").addEventListener("click",closeSide);
$("#meBtn").addEventListener("click",function(){openProfile("me")});
$("#logoutBtn").innerHTML=ICON.out;
$("#sendBtn").innerHTML=ICON.send;
$("#noticeClose").addEventListener("click",function(){$("#notice").hidden=true});
$("#sendBtn").addEventListener("click",function(){var i=$("#input");send(i.value);i.value="";i.style.height="auto"});
$("#photoBtn").addEventListener("click",addPhoto);
$("#editNoticeBtn").addEventListener("click",editPinnedNotice);
$("#input").addEventListener("keydown",function(e){
  if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();send(this.value);this.value="";this.style.height="auto"}
});
$("#input").addEventListener("input",function(){this.style.height="auto";this.style.height=Math.min(this.scrollHeight,120)+"px"});

function setRole(r){
  role=r;
  $("#tabStudent").setAttribute("aria-pressed",r==="student");
  $("#tabTeacher").setAttribute("aria-pressed",r==="teacher");
  $("#loginName").placeholder=r==="teacher"?"예: 김민수":"예: 김하늘";
}
$("#tabStudent").addEventListener("click",function(){setRole("student")});
$("#tabTeacher").addEventListener("click",function(){setRole("teacher")});
$("#authToggle").addEventListener("click",function(){registerMode=!registerMode;$("#authSubmit").textContent=registerMode?"회원가입":"로그인";this.textContent=registerMode?"이미 계정이 있나요? 로그인":"처음이신가요? 회원가입";$("#loginPw").placeholder=registerMode?"6자 이상 비밀번호":"비밀번호";$("#authHint").textContent=registerMode?"개인 코드는 회원가입 시 발급됩니다. 이 시연용 계정은 현재 브라우저에만 저장돼요.":"시연용 계정은 이 브라우저에만 저장됩니다. 실제 서비스에는 Firebase 인증 연결이 필요합니다.";});
$("#loginForm").addEventListener("submit",function(e){
  e.preventDefault();
  var nm=$("#loginName").value.trim(),pw=$("#loginPw").value;
  if(!nm||!pw){toast("이름과 비밀번호를 입력해 주세요.");return;}
  var key=role+":"+nm.toLowerCase();
  try{accounts=JSON.parse(localStorage.getItem("historiatalk_accounts")||"{}")}catch(_){accounts={}}
  if(registerMode){
    if(pw.length<6){toast("비밀번호는 6자 이상으로 설정해 주세요.");return;}
    if(accounts[key]){toast("이미 가입된 이름이에요. 로그인해 주세요.");return;}
    var code=makePersonalCode();accounts[key]={name:nm,pw:pw,role:role,code:code};localStorage.setItem("historiatalk_accounts",JSON.stringify(accounts));toast("회원가입 완료! 개인 코드: "+code);
  }else if(accounts[key]&&accounts[key].pw!==pw){toast("비밀번호가 일치하지 않아요.");return;}
  init();
  var acct=accounts[key];
  profiles.me=me={id:"me",name:nm,kind:role==="teacher"?"teacher":"student",color:"#5B6C8F",role:role==="teacher"?"교직원":"학생",birthday:"",likes:"",traits:"",img:null,bg:null,personalCode:acct?acct.code:makePersonalCode()};
  if(!accounts[key]){accounts[key]={name:nm,pw:pw,role:role,code:profiles.me.personalCode};try{localStorage.setItem("historiatalk_accounts",JSON.stringify(accounts))}catch(_){}}
  $("#login").hidden=true;$("#app").hidden=false;$("#notice").hidden=false;
  renderSide();renderMain();
});
$("#logoutBtn").addEventListener("click",function(){
  $("#app").hidden=true;$("#login").hidden=false;$("#loginPw").value="";closeSide();closeModal();
});
init();
})();
</script>
</body>
</html>
